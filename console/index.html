<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000005; --glass: rgba(10, 22, 48, .42); --line: rgba(0, 212, 255, .16); --line-2: rgba(0, 212, 255, .34);
    --text: #dff6ff; --muted: #6f8fb0; --cyan: #00d4ff; --blue: #2f7bff; --violet: #7a5cff;
    --green: #00ff9d; --red: #ff3b5c; --amber: #ffb020;
    --mood: var(--cyan);
    --display: "Orbitron", "Segoe UI", system-ui, sans-serif;
    --ui: "Rajdhani", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  body.m-waiting { --mood: var(--amber); } body.m-done { --mood: var(--green); } body.m-failed { --mood: var(--red); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 500 16px/1.5 var(--ui); }
  body { min-height: 100vh; overflow-x: hidden; padding-bottom: 34px; }
  a { color: var(--cyan); text-decoration: none; border-bottom: 1px dashed rgba(0,212,255,.5); }
  a:hover { text-shadow: 0 0 8px var(--cyan); }

  /* ---------- background: starfield, grid, scanlines ---------- */
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .grid-floor { position: fixed; inset: auto 0 0 0; height: 45vh; z-index: 0; pointer-events: none; opacity: .35;
    background-image: linear-gradient(rgba(0,212,255,.18) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,.18) 1px, transparent 1px);
    background-size: 48px 48px; transform: perspective(500px) rotateX(62deg); transform-origin: bottom;
    mask-image: linear-gradient(to top, #000 0%, transparent 85%); -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 85%); }
  .vignette { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(900px 520px at 50% 28%, rgba(0,90,180,.20), transparent 70%); }
  .scanlines { position: fixed; inset: 0; z-index: 50; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
  .scanlines::after { content: ""; position: absolute; left: 0; right: 0; top: -20%; height: 18%;
    background: linear-gradient(to bottom, transparent, rgba(0,212,255,.05), transparent); animation: sweep 7s linear infinite; }
  @keyframes sweep { to { top: 110%; } }
  .wrap { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; padding: 0 16px 40px; }

  /* ---------- HUD corner brackets ---------- */
  .hud { position: relative; }
  .hud > .hc { position: absolute; width: 16px; height: 16px; border: 0 solid var(--hud, var(--cyan)); opacity: .8; pointer-events: none; }
  .hud > .hc.tl { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
  .hud > .hc.tr { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
  .hud > .hc.bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
  .hud > .hc.br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 14px; padding: 20px 0 8px; flex-wrap: wrap; }
  .brand { font: 900 26px/1 var(--display); letter-spacing: 8px; color: var(--cyan); text-shadow: 0 0 10px rgba(0,212,255,.8), 0 0 30px rgba(0,212,255,.4); }
  .brand small { display: block; font: 500 10px/1 var(--display); letter-spacing: 5px; color: var(--muted); margin-top: 7px; text-shadow: none; }
  .spacer { flex: 1; }
  .conn { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); letter-spacing: .5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); flex: none; }
  .dot.on { background: var(--green); box-shadow: 0 0 10px var(--green); animation: blip 2s infinite; }
  @keyframes blip { 50% { opacity: .45; } }
  .clock { text-align: right; font: 700 16px/1 var(--display); letter-spacing: 2px; color: var(--text); text-shadow: 0 0 8px rgba(0,212,255,.5); }
  .clock small { display: block; font: 500 10px/1 var(--display); letter-spacing: 2px; color: var(--muted); margin-top: 5px; text-shadow: none; }
  .lang-btn { display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; cursor: pointer;
    font: 900 14px/1 var(--display); letter-spacing: 3px; color: #eaffff; border: 1px solid var(--cyan);
    background: radial-gradient(120% 160% at 50% 0%, rgba(0,212,255,.3), rgba(0,40,90,.5)); text-shadow: 0 0 8px var(--cyan);
    box-shadow: 0 0 18px rgba(0,212,255,.45), inset 0 0 14px rgba(0,212,255,.25); transition: transform .15s, box-shadow .25s; }
  .lang-btn:hover { box-shadow: 0 0 30px rgba(0,212,255,.75), inset 0 0 18px rgba(0,212,255,.4); }
  .lang-btn:active { transform: scale(.95); }
  .lang-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
  .lang-btn .flag { width: 24px; height: 15px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,.35), 0 0 8px rgba(0,0,0,.6); flex: none; }

  .voice-btn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--cyan);
    border: 1px solid var(--cyan); background: rgba(0,25,55,.7); box-shadow: 0 0 16px rgba(0,212,255,.4), inset 0 0 12px rgba(0,212,255,.2); transition: box-shadow .25s, color .25s; }
  .voice-btn svg { width: 22px; height: 22px; filter: drop-shadow(0 0 5px rgba(0,212,255,.8)); }
  .voice-btn:hover { box-shadow: 0 0 28px rgba(0,212,255,.7), inset 0 0 16px rgba(0,212,255,.35); }
  .voice-btn.off { color: var(--muted); border-color: var(--line-2); box-shadow: none; }
  .voice-btn.off svg { filter: none; }
  .voice-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
  #approvalHeard { margin-top: 14px; }
  .user-box { display: inline-flex; align-items: center; gap: 8px; font: 600 14px/1.2 var(--ui); color: var(--text); }
  .user-box .who { font-weight: 700; }
  .auth-warn { color: var(--amber); font-size: 12px; }
  .auth-badge { padding: 3px 8px; border-radius: 4px; font: 700 9px/1 var(--display); letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--green); border: 1px solid var(--green); background: rgba(0,255,157,.08); }
  .user-box a.logout { font: 700 10px/1 var(--display); letter-spacing: 1.5px; color: var(--muted); border-bottom: 0; }
  .user-box a.logout:hover { color: var(--cyan); }
  .demo-pick { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border-radius: 999px;
    border: 1px dashed var(--amber); background: rgba(255,176,32,.08); color: var(--amber); font: 700 10px/1 var(--display); letter-spacing: 1.5px; }
  .demo-pick select { background: rgba(0,12,30,.9); color: var(--text); border: 1px solid rgba(255,176,32,.5); border-radius: 999px;
    padding: 5px 8px; font: 600 13px/1 var(--ui); cursor: pointer; }
  .demo-pick select:focus-visible, .demo-toggle input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .demo-toggle { display: inline-flex; align-items: center; gap: 4px; font: 700 9px/1 var(--display); letter-spacing: 1.5px; color: var(--muted); cursor: pointer; }
  .wake-btn { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; border-radius: 999px; cursor: pointer;
    font: 700 10px/1 var(--display); letter-spacing: 2px; color: var(--muted); border: 1px solid var(--line-2); background: rgba(0,25,55,.7); transition: all .25s; }
  .wake-btn[aria-pressed="true"] { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 16px rgba(0,212,255,.35); }
  .wake-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
  .wake-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .wake-btn.listening .wake-dot { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: blip 1.6s ease-in-out infinite; }
  .wake-btn.paused .wake-dot { background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: none; }
  .stage.woke svg.head { opacity: 1; filter: drop-shadow(0 0 14px var(--cyan)) drop-shadow(0 0 34px var(--cyan)); animation: pop .6s ease-out; }

  /* mic button */
  .action-row { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .mic { position: relative; width: 66px; height: 66px; border-radius: 50%; flex: none; cursor: pointer; display: grid; place-items: center;
    color: #ffd6dd; border: 1px solid var(--red); background: radial-gradient(circle at 50% 30%, rgba(255,59,92,.35), rgba(80,0,20,.6));
    box-shadow: 0 0 20px rgba(255,59,92,.45), inset 0 0 18px rgba(255,59,92,.3); transition: transform .15s, box-shadow .25s; }
  .mic svg { width: 28px; height: 28px; filter: drop-shadow(0 0 6px rgba(255,59,92,.9)); }
  .mic:hover:not(:disabled) { box-shadow: 0 0 34px rgba(255,59,92,.75), inset 0 0 22px rgba(255,59,92,.45); }
  .mic:active:not(:disabled) { transform: scale(.94); }
  .mic:disabled { cursor: wait; }
  .mic:focus-visible { outline: 2px solid var(--red); outline-offset: 4px; }
  .mic .mic-label { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap;
    font: 700 10px/1 var(--display); letter-spacing: 2px; color: var(--red); text-shadow: 0 0 8px var(--red); }
  .mic.recording { color: #fff; background: radial-gradient(circle, rgba(255,59,92,.9), rgba(160,0,30,.8)); animation: micpulse 1s ease-out infinite; }
  .mic.busy { border-color: var(--cyan); color: var(--cyan); background: radial-gradient(circle, rgba(0,212,255,.25), rgba(0,30,60,.7)); box-shadow: 0 0 20px rgba(0,212,255,.4); }
  .mic.busy .mic-label { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
  @keyframes micpulse { 0% { box-shadow: 0 0 0 0 rgba(255,59,92,.8), 0 0 30px rgba(255,59,92,.8); } 100% { box-shadow: 0 0 0 26px rgba(255,59,92,0), 0 0 30px rgba(255,59,92,.8); } }
  .ticket-info { margin-top: 10px; display: flex; align-items: center; gap: 10px; font: 600 15px/1.3 var(--ui); color: var(--muted); }
  .ticket-info[hidden] { display: none; }
  .ticket-info b { color: var(--text); font-family: var(--display); font-size: 12px; letter-spacing: 1px; }
  .prio-badge { padding: 4px 10px; border-radius: 4px; font: 700 10px/1 var(--display); letter-spacing: 1.5px; text-transform: uppercase; border: 1px solid currentColor; }
  .prio-badge.high { color: var(--red); background: rgba(255,59,92,.1); }
  .prio-badge.medium { color: #9aa8b8; background: rgba(154,168,184,.08); }
  .prio-badge.low { color: var(--blue); background: rgba(47,123,255,.1); }
  .pr-warn { margin-top: 10px; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,176,32,.55); background: rgba(255,176,32,.08);
    color: var(--amber); font: 600 15px/1.4 var(--ui); }
  .pr-warn[hidden] { display: none; }
  .pr-warn a { color: var(--amber); border-bottom-color: rgba(255,176,32,.6); }
  .pr-badge { margin-left: 8px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--amber); color: var(--amber);
    font: 700 9px/1 var(--display); letter-spacing: 1.5px; text-transform: uppercase; }
  .pr-badge:hover { text-shadow: 0 0 8px var(--amber); }
  .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 10px auto 0; max-width: 820px; }
  .choices[hidden] { display: none; }
  .choice { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; padding: 8px 14px; border-radius: 999px;
    font: 600 14px/1.2 var(--ui); color: var(--text); border: 1px solid var(--line-2); background: rgba(0,25,55,.7); transition: box-shadow .2s, border-color .2s; }
  .choice b { color: var(--cyan); font-family: var(--display); font-size: 12px; letter-spacing: 1px; margin-right: 4px; }
  .choice:hover, .choice:focus-visible { border-color: var(--cyan); box-shadow: 0 0 16px rgba(0,212,255,.45); outline: none; }
  .heard { min-height: 22px; font: 600 15px/1.4 var(--ui); color: var(--muted); text-align: center; margin-top: 6px; }
  .heard b { color: var(--cyan); font-family: var(--display); letter-spacing: 1px; text-shadow: 0 0 8px rgba(0,212,255,.5); }
  .heard.err { color: var(--red); }

  /* chat drawer */
  .chat-toggle { position: fixed; right: 18px; bottom: 50px; z-index: 45; display: inline-flex; align-items: center; gap: 9px; padding: 13px 18px;
    border-radius: 999px; cursor: pointer; font: 700 12px/1 var(--display); letter-spacing: 2.5px; color: #eaffff; border: 1px solid var(--cyan);
    background: rgba(0,25,55,.85); backdrop-filter: blur(10px); text-shadow: 0 0 8px var(--cyan);
    box-shadow: 0 0 20px rgba(0,212,255,.45), inset 0 0 14px rgba(0,212,255,.2); transition: box-shadow .25s, transform .15s; }
  .chat-toggle svg { width: 18px; height: 18px; }
  .chat-toggle:hover { box-shadow: 0 0 34px rgba(0,212,255,.75), inset 0 0 18px rgba(0,212,255,.35); }
  .chat-toggle[aria-expanded="true"] { opacity: 0; pointer-events: none; }
  .chat { position: fixed; top: 16px; right: 16px; bottom: 44px; z-index: 46; width: min(400px, calc(100vw - 32px)); display: flex; flex-direction: column;
    background: rgba(2,10,26,.92); border: 1px solid var(--line-2); border-radius: 14px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 0 50px rgba(0,212,255,.18), 0 20px 60px rgba(0,0,0,.6); animation: slidein .3s ease-out; }
  .chat[hidden] { display: none; }
  @keyframes slidein { from { opacity: 0; transform: translateX(30px); } }
  .chat-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  .chat-head .ptitle { flex: 1; }
  .chat-x { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; color: var(--cyan); font-size: 20px; line-height: 1; cursor: pointer; }
  .chat-x:hover { box-shadow: 0 0 14px rgba(0,212,255,.4); }
  .chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .chat-log::-webkit-scrollbar { width: 6px; } .chat-log::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
  .bubble { max-width: 85%; padding: 10px 14px; border-radius: 14px; font: 500 15px/1.45 var(--ui); white-space: pre-wrap; word-break: break-word; }
  .bubble.user { align-self: flex-end; background: linear-gradient(135deg, rgba(47,123,255,.55), rgba(47,123,255,.3)); border: 1px solid rgba(47,123,255,.7);
    border-bottom-right-radius: 4px; box-shadow: 0 0 14px rgba(47,123,255,.25); }
  .bot-row { display: flex; gap: 8px; align-items: flex-end; align-self: flex-start; max-width: 92%; }
  .bot-row svg { width: 26px; height: 26px; flex: none; color: var(--cyan); filter: drop-shadow(0 0 6px rgba(0,212,255,.8)); }
  .bubble.bot { background: rgba(0,212,255,.08); border: 1px solid rgba(0,212,255,.45); border-bottom-left-radius: 4px; color: #d8f8ff; box-shadow: 0 0 14px rgba(0,212,255,.15); max-width: none; }
  .bubble code { font: 13px/1.4 var(--mono); background: rgba(0,0,0,.35); border: 1px solid rgba(0,212,255,.2); border-radius: 4px; padding: 1px 5px; }
  .bubble pre { margin: 8px 0; padding: 10px; background: rgba(0,0,0,.45); border: 1px solid rgba(0,212,255,.2); border-radius: 8px; overflow-x: auto; white-space: pre; }
  .bubble pre code { background: none; border: 0; padding: 0; }
  .bubble b { color: #fff; }
  .bubble.bot.err { border-color: rgba(255,59,92,.6); color: #ffc9d2; background: rgba(255,59,92,.08); }
  .typing i { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--cyan); animation: dots 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes dots { 0%, 100% { opacity: .2; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
  .chat-empty { color: var(--muted); text-align: center; margin: auto 0; font-size: 14px; letter-spacing: .5px; }
  .chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  .chat-form input { flex: 1; min-width: 0; background: rgba(0,12,30,.8); color: var(--text); border: 1px solid var(--line-2); border-radius: 10px; padding: 12px 14px; font: 500 15px/1.3 var(--ui); }
  .chat-form input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 16px rgba(0,212,255,.3); }
  .chat-form button { width: 46px; flex: none; border-radius: 10px; border: 1px solid var(--cyan); background: rgba(0,212,255,.12); color: var(--cyan); cursor: pointer; display: grid; place-items: center; }
  .chat-form button svg { width: 19px; height: 19px; }
  .chat-form button:hover:not(:disabled) { box-shadow: 0 0 18px rgba(0,212,255,.5); } .chat-form button:disabled { opacity: .4; cursor: wait; }

  /* ---------- glass panels ---------- */
  .panel { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 20px;
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); margin-top: 18px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 20px 60px rgba(0,0,0,.5); }
  .ptitle { margin: 0 0 14px; font: 700 12px/1 var(--display); letter-spacing: 3px; color: var(--cyan); text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .ptitle::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-2), transparent); }

  /* ---------- ticket selector ---------- */
  .ticket-bar { display: flex; gap: 10px; align-items: stretch; margin-top: 14px; }
  .select-wrap { position: relative; flex: 1; min-width: 0; }
  .select-wrap::after { content: "▾"; position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--cyan); pointer-events: none; font-size: 18px; text-shadow: 0 0 8px var(--cyan); }
  select#ticketSelect { width: 100%; appearance: none; -webkit-appearance: none; background: rgba(0,20,45,.75); color: var(--text);
    border: 1px solid var(--line-2); border-radius: 12px; padding: 18px 48px 18px 20px; font: 600 19px/1.2 var(--ui); letter-spacing: .4px; cursor: pointer;
    box-shadow: 0 0 0 1px rgba(0,212,255,.08), 0 0 24px rgba(0,212,255,.18), inset 0 0 22px rgba(0,212,255,.08); transition: box-shadow .25s, border-color .25s; }
  select#ticketSelect:hover, select#ticketSelect:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 36px rgba(0,212,255,.45), inset 0 0 26px rgba(0,212,255,.14); }
  select option { background: #020818; color: var(--text); }
  .icon-btn { width: 62px; flex: none; border-radius: 12px; border: 1px solid var(--line-2); background: rgba(0,20,45,.75); color: var(--cyan); font-size: 22px; cursor: pointer; transition: box-shadow .2s, transform .3s; }
  .icon-btn:hover { box-shadow: 0 0 22px rgba(0,212,255,.45); }
  .icon-btn:active { transform: rotate(180deg); }
  svg[hidden] { display: none !important; }   /* SVG ignores the hidden attribute without this */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- reactor / stage ---------- */
  .stage { position: relative; display: grid; place-items: center; margin: 22px auto 0; width: min(440px, 100%); aspect-ratio: 1; }
  .stage > *:not(.hc) { grid-area: 1 / 1; }
  .stage.hud { --hud: var(--mood); }
  svg.orbits { width: 100%; height: 100%; overflow: visible; }
  .orbits circle { fill: none; stroke: var(--mood); transition: stroke .6s, opacity .6s; }
  .orbits .o1 { stroke-width: 1.5; stroke-dasharray: 2 10; opacity: .55; }
  .orbits .o2 { stroke-width: 3; stroke-dasharray: 120 40 20 40; opacity: .75; filter: drop-shadow(0 0 6px var(--mood)); }
  .orbits .o3 { stroke-width: 1; opacity: .35; }
  .orbits .o4 { stroke-width: 6; stroke-dasharray: 3 7; opacity: .4; }
  .orbits .o5 { stroke-width: 2; stroke-dasharray: 60 300; opacity: .9; filter: drop-shadow(0 0 8px var(--mood)); }
  .orbits g { transform-origin: 200px 200px; transform-box: view-box; }
  .orbits .spin-a { animation: spin 40s linear infinite; } .orbits .spin-b { animation: spin 18s linear infinite reverse; }
  .orbits .spin-c { animation: spin 26s linear infinite; } .orbits .spin-d { animation: spin 7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .working .orbits .spin-b { animation-duration: 5s; } .working .orbits .spin-d { animation-duration: 1.6s; } .working .orbits .spin-c { animation-duration: 8s; }
  .idle .orbits circle { opacity: .45; }

  .ripples { position: relative; width: 44%; aspect-ratio: 1; pointer-events: none; }
  .ripples i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--mood); opacity: 0; }
  .working .ripples i, .waiting .ripples i { animation: ripple 3.2s cubic-bezier(.2,.6,.3,1) infinite; }
  .ripples i:nth-child(2) { animation-delay: .8s !important; } .ripples i:nth-child(3) { animation-delay: 1.6s !important; } .ripples i:nth-child(4) { animation-delay: 2.4s !important; }
  .waiting .ripples i { animation-duration: 4.5s; }
  @keyframes ripple { 0% { transform: scale(.9); opacity: .9; box-shadow: 0 0 20px var(--mood); } 100% { transform: scale(2.35); opacity: 0; } }
  .burst i { animation: ripple 1.2s cubic-bezier(.2,.6,.3,1) 1 !important; }

  .core-glow { width: 50%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--mood) 35%, transparent) 0%, transparent 68%);
    opacity: .35; transition: opacity .6s; animation: breathe 4s ease-in-out infinite; }
  .working .core-glow, .done .core-glow, .failed .core-glow, .waiting .core-glow { opacity: .9; }
  @keyframes breathe { 50% { transform: scale(1.12); } }

  /* robot */
  svg.head { width: 36%; overflow: visible; transition: filter .6s, opacity .6s; opacity: .55; filter: drop-shadow(0 0 4px rgba(0,212,255,.3)); }
  .head .shell { fill: rgba(4,14,32,.92); stroke: var(--mood); stroke-width: 2.5; transition: stroke .6s; }
  .head .trim { fill: none; stroke: var(--mood); stroke-width: 1.2; opacity: .55; transition: stroke .6s; }
  .head .visor { fill: rgba(0,10,25,.95); stroke: var(--mood); stroke-width: 1.5; transition: stroke .6s; }
  .head .eye { fill: var(--mood); transition: fill .6s; transform-box: fill-box; transform-origin: center; }
  .head .mouth rect { fill: var(--mood); transition: fill .6s; transform-box: fill-box; transform-origin: center; }
  .head .ant { stroke: var(--mood); fill: var(--mood); transition: stroke .6s, fill .6s; }
  .head .led { transition: fill .6s; animation: led 1.8s steps(1) infinite; }
  .head .led.l1 { fill: var(--mood); } .head .led.l2 { fill: var(--amber); animation-delay: .6s; } .head .led.l3 { fill: var(--green); animation-delay: 1.2s; }
  .head .led.l4 { fill: var(--mood); animation-duration: 1.1s; } .head .led.l5 { fill: var(--mood); animation-duration: 1.1s; animation-delay: .55s; }
  @keyframes led { 0%, 55% { opacity: 1; } 56%, 100% { opacity: .15; } }
  .working .head .led { animation-duration: .5s; } .working .head .led.l2 { animation-delay: .17s; } .working .head .led.l3 { animation-delay: .34s; }
  .done .head .led, .failed .head .led { fill: var(--mood); animation-duration: 1s; }
  .idle svg.head { animation: float 5s ease-in-out infinite; }
  .idle .head .eye { opacity: .6; animation: blink 6s infinite; }
  .working svg.head, .waiting svg.head { opacity: 1; filter: drop-shadow(0 0 10px var(--mood)) drop-shadow(0 0 28px var(--mood)); animation: float 2.4s ease-in-out infinite; }
  .working .head .eye { animation: scan 1.6s ease-in-out infinite; }
  .working .head .mouth rect { animation: talk .5s ease-in-out infinite; }
  .working .head .mouth rect:nth-child(2) { animation-delay: .1s; } .working .head .mouth rect:nth-child(3) { animation-delay: .2s; }
  .working .head .mouth rect:nth-child(4) { animation-delay: .3s; } .working .head .mouth rect:nth-child(5) { animation-delay: .15s; }
  .working .head .ant circle { animation: blip .6s infinite; }
  .waiting .head .eye { animation: blink 3s infinite; }
  .done svg.head { opacity: 1; filter: drop-shadow(0 0 12px var(--green)) drop-shadow(0 0 34px var(--green)); animation: pop .6s ease-out; }
  .done .head .eye { transform: scaleY(.45); }
  .failed svg.head { opacity: 1; filter: drop-shadow(0 0 12px var(--red)) drop-shadow(0 0 34px var(--red)); animation: shake .5s 2; }
  .failed .head .eye { transform: scaleY(.25) rotate(8deg); }
  @keyframes float { 50% { transform: translateY(-6px); } }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes scan { 0%, 100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
  @keyframes talk { 50% { transform: scaleY(2.4); } }
  @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  .status-line { text-align: center; margin-top: 4px; }
  .phase { font: 700 20px/1.3 var(--display); letter-spacing: 4px; color: var(--mood); text-transform: uppercase; margin: 0; text-shadow: 0 0 14px var(--mood); transition: color .6s; }
  .phase small { display: block; font: 500 13px/1.6 var(--ui); letter-spacing: 2px; color: var(--muted); text-shadow: none; }
  canvas#wave { display: block; width: 100%; height: 90px; margin-top: 4px; }

  /* progress */
  .progress { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
  .progress .track { flex: 1; height: 8px; border-radius: 4px; background: rgba(0,212,255,.08); border: 1px solid var(--line); overflow: hidden; position: relative; }
  .progress .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--mood)); box-shadow: 0 0 14px var(--mood); transition: width .6s ease, background .6s; position: relative; }
  .progress .fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); animation: shimmer 1.6s linear infinite; }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .progress .pct { min-width: 58px; text-align: right; font: 700 16px/1 var(--display); color: var(--mood); text-shadow: 0 0 10px var(--mood); letter-spacing: 1px; }
  .steps { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-top: 10px; }
  .step { text-align: center; font: 600 11px/1.2 var(--ui); color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .step .bar { height: 4px; border-radius: 2px; background: rgba(0,212,255,.1); margin-bottom: 6px; transition: background .4s, box-shadow .4s; }
  .step.done .bar { background: var(--blue); box-shadow: 0 0 8px var(--blue); }
  .step.current { color: var(--cyan); }
  .step.current .bar { background: var(--cyan); box-shadow: 0 0 14px var(--cyan); animation: blip .9s infinite; }
  .step.failed { color: var(--red); } .step.failed .bar { background: var(--red); box-shadow: 0 0 14px var(--red); }
  .step.allgreen .bar { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .step.skipped .bar { background: rgba(255,255,255,.05); }
  .stepnum { display: none; }

  /* ---------- controls ---------- */
  .controls { display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: 20px; }
  .holo-toggle { position: relative; display: inline-flex; align-items: center; gap: 14px; cursor: pointer; user-select: none; padding: 10px 18px;
    border: 1px solid var(--line); border-radius: 999px; background: rgba(0,20,45,.5); transition: border-color .3s, box-shadow .3s; }
  .holo-toggle:hover { border-color: var(--line-2); box-shadow: 0 0 18px rgba(0,212,255,.15); }
  .holo-toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .holo-toggle .track { position: relative; width: 58px; height: 26px; border-radius: 999px; border: 1px solid var(--line-2);
    background: repeating-linear-gradient(90deg, rgba(0,212,255,.08) 0 2px, transparent 2px 6px); transition: all .3s; }
  .holo-toggle .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; transition: transform .3s, background .3s, box-shadow .3s; }
  .holo-toggle input:checked + .track { border-color: var(--cyan); box-shadow: 0 0 14px rgba(0,212,255,.5), inset 0 0 10px rgba(0,212,255,.3); }
  .holo-toggle input:checked + .track::after { transform: translateX(32px); background: var(--cyan); box-shadow: 0 0 12px var(--cyan), 0 0 24px var(--cyan); }
  .holo-toggle input:not(:checked) + .track { border-color: var(--amber); }
  .holo-toggle input:not(:checked) + .track::after { background: var(--amber); box-shadow: 0 0 12px var(--amber); }
  .holo-toggle input:focus-visible + .track { outline: 2px solid var(--cyan); outline-offset: 3px; }
  .toggle-text { display: flex; flex-direction: column; line-height: 1.2; }
  .toggle-text b { font: 700 12px/1.3 var(--display); letter-spacing: 2px; color: var(--text); }
  .toggle-text span { font-size: 13px; color: var(--muted); }

  .activate { position: relative; font: 900 18px/1 var(--display); letter-spacing: 6px; color: #eaffff; padding: 22px 46px; min-width: min(380px, 100%);
    border: 1px solid var(--cyan); border-radius: 999px; cursor: pointer; overflow: hidden;
    background: radial-gradient(120% 180% at 50% 0%, rgba(0,212,255,.35), rgba(0,60,140,.35) 55%, rgba(0,10,30,.8));
    text-shadow: 0 0 10px var(--cyan); box-shadow: 0 0 22px rgba(0,212,255,.55), 0 0 60px rgba(0,120,255,.3), inset 0 0 24px rgba(0,212,255,.35);
    transition: transform .15s, box-shadow .3s, opacity .3s; animation: idleglow 3s ease-in-out infinite; }
  .activate::before { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent); transform: skewX(-20deg); animation: sheen 3.6s ease-in-out infinite; }
  .activate:hover:not(:disabled) { box-shadow: 0 0 34px rgba(0,212,255,.8), 0 0 90px rgba(0,120,255,.45), inset 0 0 30px rgba(0,212,255,.45); }
  .activate:active:not(:disabled) { transform: scale(.97); }
  .activate:disabled { cursor: not-allowed; opacity: .4; animation: none; }
  .activate:disabled::before { display: none; }
  .activate.pulse { animation: clickpulse .9s ease-out; }
  .activate.engaged:disabled { opacity: .85; animation: engaged 1.4s ease-in-out infinite; }
  @keyframes idleglow { 50% { box-shadow: 0 0 30px rgba(0,212,255,.75), 0 0 80px rgba(0,120,255,.4), inset 0 0 28px rgba(0,212,255,.4); } }
  @keyframes engaged { 50% { box-shadow: 0 0 40px rgba(0,212,255,.9), 0 0 110px rgba(0,120,255,.6), inset 0 0 36px rgba(0,212,255,.6); } }
  @keyframes clickpulse { 0% { box-shadow: 0 0 0 0 rgba(0,212,255,.9), 0 0 60px rgba(0,212,255,.8); } 100% { box-shadow: 0 0 0 36px rgba(0,212,255,0), 0 0 20px rgba(0,212,255,.3); } }
  @keyframes sheen { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  .msg { font-size: 15px; min-height: 22px; text-align: center; }
  .msg.ok { color: var(--green); } .msg.err { color: var(--red); text-shadow: 0 0 8px rgba(255,59,92,.4); }

  /* ---------- live log ---------- */
  #live { display: none; } #live.show { display: block; animation: rise .5s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  #log { background: rgba(0,4,12,.8); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; height: 260px; overflow: auto;
    font: 13px/1.7 var(--mono); box-shadow: inset 0 0 30px rgba(0,212,255,.05); }
  #log::-webkit-scrollbar { width: 6px; } #log::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
  #log div { white-space: pre-wrap; word-break: break-word; }
  #log .t { color: #3d6a8a; } #log .s { color: var(--cyan); text-shadow: 0 0 6px rgba(0,212,255,.5); font-weight: 600; }
  #log .e { color: var(--red); } #log .g { color: var(--green); } #log .m { color: #b8d8ef; }
  #log .caret::after { content: "▌"; color: var(--cyan); animation: blip .7s steps(1) infinite; margin-left: 1px; }

  /* ---------- approval ---------- */
  #approval { display: none; --hud: var(--amber); border-color: rgba(255,176,32,.45); box-shadow: 0 0 40px rgba(255,176,32,.12), inset 0 0 40px rgba(255,176,32,.04); }
  #approval.show { display: block; animation: rise .5s ease-out; }
  #approval .ptitle { color: var(--amber); } #approval .ptitle::after { background: linear-gradient(90deg, rgba(255,176,32,.5), transparent); }
  .plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .plan-grid .full { grid-column: 1 / -1; }
  .lbl-sm { font: 700 10px/1 var(--display); letter-spacing: 2.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  #planApproach { margin: 0; font-size: 17px; line-height: 1.5; }
  #approval ul { margin: 0; padding-left: 18px; } #approval li { margin-bottom: 4px; } #approval li::marker { color: var(--amber); }
  #approval li strong { font-family: var(--mono); font-size: 13px; color: var(--cyan); font-weight: 500; }
  .risk { display: inline-block; padding: 4px 12px; border-radius: 4px; font: 700 11px/1 var(--display); letter-spacing: 2px; text-transform: uppercase; border: 1px solid currentColor; }
  .risk.low { color: var(--green); background: rgba(0,255,157,.08); } .risk.medium { color: var(--amber); background: rgba(255,176,32,.08); } .risk.high { color: var(--red); background: rgba(255,59,92,.1); }
  .status-text { color: var(--muted); font-size: 14px; }
  .approve-row { display: flex; gap: 18px; margin-top: 22px; flex-wrap: wrap; }
  .big { flex: 1; min-width: 180px; font: 900 18px/1 var(--display); letter-spacing: 5px; padding: 24px 20px; border-radius: 12px; cursor: pointer; background: transparent; transition: transform .15s, box-shadow .3s, background .3s; }
  .big:active:not(:disabled) { transform: scale(.97); } .big:disabled { opacity: .4; cursor: not-allowed; }
  .big.approve { color: var(--green); border: 2px solid var(--green); text-shadow: 0 0 12px var(--green); background: rgba(0,255,157,.07);
    box-shadow: 0 0 24px rgba(0,255,157,.35), inset 0 0 24px rgba(0,255,157,.15); animation: gpulse 2s ease-in-out infinite; }
  .big.approve:hover:not(:disabled) { background: rgba(0,255,157,.16); box-shadow: 0 0 50px rgba(0,255,157,.6), inset 0 0 30px rgba(0,255,157,.25); }
  .big.reject { color: var(--red); border: 2px solid var(--red); text-shadow: 0 0 12px var(--red); background: rgba(255,59,92,.07); box-shadow: 0 0 24px rgba(255,59,92,.3), inset 0 0 24px rgba(255,59,92,.12); }
  .big.reject:hover:not(:disabled) { background: rgba(255,59,92,.16); box-shadow: 0 0 50px rgba(255,59,92,.55), inset 0 0 30px rgba(255,59,92,.25); }
  @keyframes gpulse { 50% { box-shadow: 0 0 40px rgba(0,255,157,.55), inset 0 0 30px rgba(0,255,157,.25); } }

  /* ---------- result ---------- */
  #result { display: none; }
  #result.show { display: block; animation: rise .5s ease-out; }
  #result.ok { --hud: var(--green); border-color: rgba(0,255,157,.4); box-shadow: 0 0 50px rgba(0,255,157,.12), inset 0 0 50px rgba(0,255,157,.04); }
  #result.bad { --hud: var(--red); border-color: rgba(255,59,92,.45); box-shadow: 0 0 50px rgba(255,59,92,.14), inset 0 0 50px rgba(255,59,92,.05); }
  #result h3 { margin: 0 0 16px; font: 700 17px/1.3 var(--display); letter-spacing: 2px; }
  #result.ok h3 { color: var(--green); text-shadow: 0 0 12px rgba(0,255,157,.5); } #result.bad h3 { color: var(--red); text-shadow: 0 0 12px rgba(255,59,92,.5); }
  #result dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 0; }
  #result dl > div { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 12px 14px; }
  #result dl > div.wide { grid-column: 1 / -1; }
  #result dt { font: 700 10px/1 var(--display); letter-spacing: 2.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  #result dd { margin: 0; word-break: break-word; font-size: 16px; }

  /* ---------- create ticket ---------- */
  details.panel > summary { list-style: none; cursor: pointer; }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary .ptitle { margin: 0; }
  details.panel > summary .ptitle::before { content: "+"; font-size: 16px; color: var(--cyan); width: 12px; }
  details.panel[open] > summary .ptitle::before { content: "−"; }
  details.panel[open] > summary .ptitle { margin-bottom: 14px; }
  label.fl { display: block; font: 700 10px/1 var(--display); letter-spacing: 2.5px; color: var(--muted); text-transform: uppercase; margin: 14px 0 8px; }
  input[type=text], textarea { width: 100%; background: rgba(0,12,30,.7); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: 500 16px/1.4 var(--ui); }
  textarea { min-height: 90px; resize: vertical; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 18px rgba(0,212,255,.25); }
  .btn { font: 700 13px/1 var(--display); letter-spacing: 3px; color: var(--cyan); background: rgba(0,212,255,.08); border: 1px solid var(--cyan); padding: 14px 22px; border-radius: 10px; cursor: pointer; transition: box-shadow .2s; margin-top: 14px; }
  .btn:hover:not(:disabled) { box-shadow: 0 0 22px rgba(0,212,255,.45); } .btn:disabled { opacity: .45; cursor: not-allowed; }
  #createMsg { text-align: left; margin-top: 10px; }

  /* ---------- history ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; font: 700 10px/1 var(--display); letter-spacing: 2.5px; color: var(--muted); text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid var(--line-2); }
  td { padding: 12px; border-bottom: 1px solid rgba(0,212,255,.07); }
  tbody tr { transition: background .2s; } tbody tr:hover { background: rgba(0,212,255,.05); }
  tr:last-child td { border-bottom: 0; }
  td.mono { font-family: var(--mono); font-size: 13px; }
  .pill { display: inline-block; padding: 4px 10px; border-radius: 4px; font: 700 10px/1 var(--display); letter-spacing: 1.5px; text-transform: uppercase; border: 1px solid currentColor; }
  .pill.done { color: var(--green); background: rgba(0,255,157,.07); } .pill.failed { color: var(--red); background: rgba(255,59,92,.08); }
  .pill.cancelled { color: var(--muted); } .pill.running, .pill.awaiting_approval { color: var(--cyan); background: rgba(0,212,255,.08); }
  .dry { font-size: 11px; color: var(--muted); margin-left: 6px; letter-spacing: 1px; }
  .load-chip { font: 700 10px/1 var(--display); letter-spacing: 1.5px; color: var(--muted); padding: 6px 10px; border: 1px solid rgba(0,212,255,.25); border-radius: 999px; white-space: nowrap; }
  .load-chip[hidden] { display: none; }
  .load-chip b { color: var(--cyan); font-weight: 700; } .load-chip.busy b.q { color: var(--amber); }
  .reject-reason { width: 100%; margin-top: 14px; padding: 10px 12px; background: rgba(0,12,30,.8); color: var(--text); border: 1px solid rgba(255,59,92,.35); border-radius: 6px; font: 15px var(--ui); }
  .reject-reason:focus-visible { outline: 2px solid var(--red); outline-offset: 1px; }
  .dec { font: 700 10px/1 var(--display); letter-spacing: 1.2px; text-transform: uppercase; }
  .dec.approved { color: var(--green, #2fe39b); } .dec.rejected { color: var(--red); } .dec.timeout { color: var(--muted); }
  .src { font-size: 11px; color: var(--muted); margin-left: 6px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { padding: 12px; border: 1px solid rgba(0,212,255,.18); border-radius: 6px; background: rgba(0,212,255,.03); }
  .stat .v { font: 700 24px/1.1 var(--display); color: var(--cyan); } .stat .k { margin-top: 6px; font-size: 12px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
  .stat .d { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .stats-note { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 16px; letter-spacing: 1px; }

  /* ---------- quick links ---------- */
  .links { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .qlink { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px 12px; border: 1px solid var(--line-2); border-radius: 12px;
    background: rgba(0,20,45,.55); color: var(--cyan); font: 700 13px/1 var(--display); letter-spacing: 3px; text-shadow: 0 0 8px rgba(0,212,255,.5);
    box-shadow: 0 0 14px rgba(0,212,255,.12), inset 0 0 18px rgba(0,212,255,.06); transition: transform .15s, box-shadow .25s, border-color .25s, background .25s; }
  .qlink:hover { border-color: var(--cyan); background: rgba(0,212,255,.1); transform: translateY(-2px); text-shadow: 0 0 12px var(--cyan);
    box-shadow: 0 0 30px rgba(0,212,255,.45), inset 0 0 24px rgba(0,212,255,.15); }
  .qlink:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
  .qlink svg { width: 20px; height: 20px; flex: none; filter: drop-shadow(0 0 6px rgba(0,212,255,.7)); }
  .qlink .ext { font-size: 11px; opacity: .6; }

  /* ---------- system status bar ---------- */
  .sysbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; align-items: center; justify-content: center; gap: 0;
    padding: 7px 16px; background: rgba(0,6,16,.88); border-top: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font: 500 10.5px/1.2 var(--display); letter-spacing: 1.5px; color: var(--muted); white-space: nowrap; overflow-x: auto; }
  .sysbar span { display: inline-flex; align-items: center; gap: 7px; padding: 0 14px; border-right: 1px solid var(--line); }
  .sysbar span:last-child { border-right: 0; }
  .sysbar i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: blip 2.4s infinite; }
  .sysbar b { color: var(--text); font-weight: 700; }

  @media (max-width: 640px) {
    .brand { font-size: 20px; letter-spacing: 5px; }
    .clock { font-size: 13px; } .conn { order: 5; width: 100%; }
    select#ticketSelect { font-size: 16px; padding: 15px 42px 15px 14px; }
    .icon-btn { width: 52px; }
    .activate { font-size: 14px; letter-spacing: 3px; padding: 20px 22px; }
    .step .lbl { display: none; } .stepnum { display: block; }
    .plan-grid { grid-template-columns: 1fr; }
    .big { font-size: 15px; letter-spacing: 3px; }

  /* ---------- visuals: starfield ---------- */
  (function stars() {
    const c = $("stars"), ctx = c.getContext("2d"); let pts = [];
    const resize = () => {
      c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
      pts = Array.from({ length: Math.round(innerWidth * innerHeight / 5000) }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.2 + .2, p: Math.random() * 6.28, s: Math.random() * .02 + .005 }));
    };
    const draw = () => {
      ctx.clearRect(0, 0, c.width, c.height);

        s.p += s.s; ctx.globalAlpha = .25 + .55 * (0.5 + 0.5 * Math.sin(s.p));

    addEventListener("resize", resize); resize(); draw();
  })();

  /* ---------- visuals: Siri-style waveform ---------- */
  const wave = (function () {
    const c = $("wave"), ctx = c.getContext("2d");
    const COLORS = { idle: ["0,212,255"], working: ["0,212,255", "47,123,255", "122,92,255"], waiting: ["255,176,32", "255,120,60"],
                     done: ["0,255,157", "0,212,255"], failed: ["255,59,92", "255,120,140"] };
    const TARGET = { idle: .06, working: 1, waiting: .35, done: .18, failed: .12 };
    let amp = .06, tt = 0;
    const resize = () => { c.width = c.clientWidth * devicePixelRatio; c.height = c.clientHeight * devicePixelRatio; };
    addEventListener("resize", resize); resize();
    function frame() {
      const w = c.width, h = c.height, mid = h / 2;
      amp += (TARGET[mood] - amp) * .04; tt += mood === "working" ? .09 : .03;
      ctx.clearRect(0, 0, w, h); ctx.globalCompositeOperation = "lighter";
      (COLORS[mood] || COLORS.idle).forEach((rgb, k) => {
        for (let layer = 0; layer < 2; layer++) {
          ctx.beginPath();
          const phase = tt * (1 + k * .35) + k * 1.7 + layer * 2.4, freq = 2.2 + k * .6 + layer * .9;
          for (let x = 0; x <= w; x += 3) {
            const nx = x / w, env = Math.pow(Math.sin(Math.PI * nx), 2.2);
            const y = mid + Math.sin(nx * freq * Math.PI * 2 + phase) * env * amp * (h * .42) * (layer ? .55 : 1) * (0.75 + 0.25 * Math.sin(tt * .7 + k));
            x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          }
          ctx.strokeStyle = "rgba(" + rgb + "," + (layer ? .35 : .85) + ")";
          ctx.lineWidth = (layer ? 1.2 : 2.2) * devicePixelRatio;
          ctx.shadowColor = "rgba(" + rgb + ",1)"; ctx.shadowBlur = 14 * devicePixelRatio;
          ctx.stroke();
        }
      });
      ctx.globalCompositeOperation = "source-over";
      if (!REDUCED) requestAnimationFrame(frame);
    }
    frame();
    return { redraw: frame };
  })();

  async function api(path, opts) {
    const res = await fetch(API + path, opts);
    if (res.status === 401 && auth.mode === "keycloak") { location.href = "/auth/login?next=/"; throw new Error("login required"); }
    let body = null;
    try { body = await res.json(); } catch (_) { /* no body */ }
    if (!res.ok) {
      const d = body && body.detail;
      throw new Error(typeof d === "string" ? d : (Array.isArray(d) ? d.map((x) => x.msg).join("; ") : "HTTP " + res.status));
    }
    return body;
  }

  /* typewriter log: lines queue up and are typed out; a long backlog types faster */

  /* ---------- voice input: record 5s in the browser, the server transcribes via Whisper ---------- */
  const MIC_SECONDS = 5;

  }
  function renderHeard() {
    const n = $("heard"), box = $("ticketChoices"), h = heardState;
    n.replaceChildren(); n.className = "heard"; box.replaceChildren(); box.hidden = true;
    if (!h) return;

  // Voice attempts go to the log panel too, even before a run starts.

  // A recognised ticket request (from the mic button, the wake word, or both in one breath).
  function applyVoiceResult(r) {

  /* ---------- voice output: lines are played one after another via /api/speak ---------- */
  let voiceOn = true;
  try { voiceOn = localStorage.getItem("jarvis.voice") !== "off"; } catch (_) { /* storage blocked */ }
  let speechChain = Promise.resolve();
  let speechEpoch = 0;                                    // bumped to drop queued lines (new run, speaker off)
  function renderVoiceBtn() {
    $("voiceBtn").setAttribute("aria-pressed", String(voiceOn));

  let currentAudio = null;

  async function playText(text, epoch) {

    try {
      const res = await fetch(API + "/api/speak", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
      if (!res.ok || epoch !== speechEpoch) return;

  /* ---------- voice approval at AWAIT_APPROVAL ---------- */
  const APPROVAL_SECONDS = 3;
  const APPROVAL_TRIES = 2;                               // ask once more when unclear, then leave the buttons
  let approvalToken = 0;                                  // bumped when a button is clicked or a run ends
  function setApprovalHeard(key, params, cls) {
    const n = $("approvalHeard"); n.className = "heard" + (cls ? " " + cls : "");
    n.textContent = key ? t(key, params) : "";
  }
  async function voiceApproval(plan, runId) {
    const token = ++approvalToken;
    const alive = () => token === approvalToken && currentRun && currentRun.id === runId && !$("approveBtn").disabled;
    if (plan.risk_class === "high") { setApprovalHeard("apprHighRisk", null, "err"); speak("Hohes Risiko. Bitte bestätigen Sie mit dem Knopf."); return; }
    if (!micAvailable()) { setApprovalHeard("apprNoMic", { u: "https://192.168.178.75:9443" }); return; }
    for (let attempt = 1; attempt <= APPROVAL_TRIES; attempt++) {
      await speak("Soll ich fortfahren? Sagen Sie Ja oder Nein.");
      if (!alive()) return;
      setApprovalHeard("apprListening", { s: APPROVAL_SECONDS });
      let r;
      try { r = await sendAudio(await recordClip(APPROVAL_SECONDS), "answer"); }
      catch (e) { if (alive()) setApprovalHeard("apprFailed", { e: e.message || "Mikrofon" }, "err"); return; }
      if (!alive()) return;
      const heard = (r.transcript || "").trim() || "…";
      if (r.answer === true) { setApprovalHeard("apprHeardYes", { h: heard }); log(t("logVoiceYes", { h: heard }), "g"); decide(true); return; }
      if (r.answer === false) { setApprovalHeard("apprHeardNo", { h: heard }); log(t("logVoiceNo", { h: heard }), "e"); decide(false); return; }
      setApprovalHeard("apprHeardUnclear", { h: heard }, "err");
      if (attempt < APPROVAL_TRIES) await speak("Ich habe Sie nicht verstanden.");
    }
    if (alive()) { setApprovalHeard("apprUseButtons", null, "err"); speak("Bitte bestätigen Sie mit dem Knopf."); }
  }

  /* ---------- chat with JARVIS (history lives only in this page session) ---------- */
  const chatHistory = [];
  const BOT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="4"/><circle cx="9.5" cy="13" r="1.5" fill="currentColor"/><circle cx="14.5" cy="13" r="1.5" fill="currentColor"/><path d="M12 3v4"/></svg>';
  // Minimal Markdown for chat answers. Everything is HTML-escaped first, so model output can never inject markup.
  function mdToHtml(src) {
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const inline = (s) => esc(s)
      .replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
      .replace(/^#{1,6}\s+(.+)$/gm, "<b>$1</b>")
      .replace(/^\s*[*-]\s+/gm, "• ");
    return src.split(/```[\w-]*\n?/).map((part, i) => i % 2 ? "<pre><code>" + esc(part.replace(/\n$/, "")) + "</code></pre>" : inline(part)).join("");
  }
  function renderChatEmpty() {
    const log = $("chatLog"), empty = log.querySelector(".chat-empty");
    if (log.querySelector(".bubble")) { if (empty) empty.remove(); return; }
    if (empty) empty.textContent = t("chatHello"); else log.appendChild(el("div", "chat-empty", t("chatHello")));
  }
  function addBubble(role, text, extraCls) {
    const log = $("chatLog"); let node;
    if (role === "user") node = el("div", "bubble user", text);
    else {
      node = el("div", "bot-row"); node.insertAdjacentHTML("afterbegin", BOT_ICON);
      const b = el("div", "bubble bot" + (extraCls ? " " + extraCls : "")); if (text !== null) b.textContent = text; node.appendChild(b);
    }
    log.appendChild(node); renderChatEmpty(); log.scrollTop = log.scrollHeight;
    return node;
  }
  function setChatOpen(open) {
    $("chat").hidden = !open; $("chatToggle").setAttribute("aria-expanded", String(open));
    if (open) { renderChatEmpty(); $("chatInput").focus(); } else $("chatToggle").focus();
  }
  $("chatToggle").addEventListener("click", () => setChatOpen(true));
  $("chatClose").addEventListener("click", () => setChatOpen(false));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("chat").hidden) setChatOpen(false); });
  $("chatForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = $("chatInput").value.trim(); if (!message) return;
    $("chatInput").value = ""; $("chatSend").disabled = true;
    addBubble("user", message);
    const pending = addBubble("bot", null), bubble = pending.querySelector(".bubble");
    bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    try {
      const r = await post("/api/chat", { message, history: chatHistory.slice(-20), lang });
      bubble.innerHTML = mdToHtml(r.response || "…");
      chatHistory.push({ role: "user", content: message }, { role: "assistant", content: r.response || "" });
    } catch (err) { bubble.classList.add("err"); bubble.textContent = t("chatFailed") + err.message; }
    $("chatSend").disabled = false; $("chatInput").focus(); $("chatLog").scrollTop = $("chatLog").scrollHeight;
  });

  /* ---------- wake word: speech is detected in the browser; only short clips go to /api/wake-check ---------- */
  const WAKE = { minSpeechMs: 250, endSilenceMs: 700, maxClipMs: 6000, preRollMs: 400, cooldownMs: 2000, floorMin: 0.012 };
  let wakeOn = false;
  try { wakeOn = localStorage.getItem("jarvis.wake") === "on"; } catch (_) { /* storage blocked */ }
  let wake = null;                  // {ctx, stream, node, floor, pre, seg, speaking, speechMs, silenceMs}
  let wakeChecking = false, wakeCooldownUntil = 0, wakeUiState = "";
  let pendingClips = [];            // speech that started while a wake check was still running
  // Never while JARVIS works, talks, waits for approval, or records for the mic button.
  const wakeBlocked = () => runActive() || !!currentAudio || micState !== "idle"
    || !!(activeRecorder && activeRecorder.state === "recording") || Date.now() < wakeCooldownUntil;
  function renderWake() {
    const b = $("wakeBtn"), state = !wakeOn ? "off" : !wake ? "starting" : wakeBlocked() ? "paused" : "listening";
    if (state === wakeUiState) return;
    wakeUiState = state;
    b.setAttribute("aria-pressed", String(wakeOn));
    b.classList.toggle("listening", state === "listening" && !wakeChecking); b.classList.toggle("paused", state === "paused");
    b.title = t(state === "off" ? "wakeTitleOff" : state === "paused" ? "wakeTitlePaused" : "wakeTitleOn");
    $("wakeLabel").textContent = t("wakeLabel");
  }
  function encodeWav(chunks, rate) {
    const total = chunks.reduce((n, c) => n + c.length, 0), ratio = rate / 16000, out = new Int16Array(Math.floor(total / ratio));
    const all = new Float32Array(total); let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
    for (let i = 0; i < out.length; i++) {                 // average down to 16 kHz
      const a = Math.floor(i * ratio), b = Math.min(total, Math.floor((i + 1) * ratio)); let sum = 0;
      for (let j = a; j < b; j++) sum += all[j];
      out[i] = Math.max(-1, Math.min(1, sum / Math.max(1, b - a))) * 0x7fff;
    }
    const buf = new ArrayBuffer(44 + out.length * 2), v = new DataView(buf);
    const str = (off, txt) => { for (let i = 0; i < txt.length; i++) v.setUint8(off + i, txt.charCodeAt(i)); };
    str(0, "RIFF"); v.setUint32(4, 36 + out.length * 2, true); str(8, "WAVE"); str(12, "fmt "); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 16000, true); v.setUint32(28, 32000, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, out.length * 2, true);
    new Int16Array(buf, 44).set(out);
    return new Blob([buf], { type: "audio/wav" });
  }
  function wakeAck() {
    burst(); $("stage").classList.add("woke"); setTimeout(() => $("stage").classList.remove("woke"), 1200);
    try {                                                   // two short, quiet tones
      const ctx = wake.ctx, g = ctx.createGain(); g.gain.value = 0.05; g.connect(ctx.destination);
      [[660, 0], [880, 0.12]].forEach(([f, at]) => { const osc = ctx.createOscillator(); osc.frequency.value = f; osc.connect(g); osc.start(ctx.currentTime + at); osc.stop(ctx.currentTime + at + 0.09); });
    } catch (_) { /* the sound is optional */ }
  }
  // Speech that was still being spoken when the check finished: wait for it (at most 3 s) and take it.
  async function takePendingClip() {
    const until = Date.now() + 3000;
    while (wake && wake.speaking && Date.now() < until) await new Promise((ok) => setTimeout(ok, 100));
    const clip = pendingClips.shift(); pendingClips = [];
    return clip || null;
  }
  async function sendCommandClip(clip) {
    setMic("busy");
    try {
      const r = await sendAudio(clip);
      if (r.status === "nothing") voiceLog("🎤 " + t("wakeNothing", { h: (r.transcript || "").trim() || "…" }), "m");
      else applyVoiceResult(r);
    } catch (e) { voiceLog("🎤 " + t("micFailed") + e.message, "m"); }
    setMic("idle");
  }
  async function checkClip(blob) {
    wakeChecking = true; pendingClips = []; renderWake();
    let next = null;
    try {
      const res = await fetch(API + "/api/wake-check", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: blob });
      if (res.status === 429) return;                       // another check is still running
      if (!res.ok) { voiceLog("👂 " + t("wakeCheckFailed") + res.status, "m"); return; }
      const r = await res.json(), heard = (r.heard || "").trim() || "…";
      if (!r.wake) {
        if (r.heard && r.heard.trim()) voiceLog("👂 " + t("logWakeMiss", { h: heard }), "m");
        next = pendingClips.shift() || null;               // someone kept talking: that clip gets its own check
        return;
      }
      wakeAck();
      if (r.ticket) { voiceLog("👂 " + t("logWakeCommand", { h: heard }), "g"); applyVoiceResult(r.ticket); return; }
      voiceLog("👂 " + t("logWake", { h: heard }), "g");
      const said = await takePendingClip();
      wakeChecking = false;
      if (said) { voiceLog("👂 " + t("logWakeBuffered"), "m"); await sendCommandClip(said); }
      else { await new Promise((ok) => setTimeout(ok, 300)); await listenForCommand(true); }   // after the tone
    } catch (e) { voiceLog("👂 " + t("wakeCheckFailed") + e.message, "m"); }
    finally {
      wakeChecking = false;
      if (!next) wakeCooldownUntil = Date.now() + WAKE.cooldownMs;
      renderWake();
      if (next && wake) checkClip(next);
    }
  }
  function onAudio(e) {
    const w = wake; if (!w) return;
    const x = e.inputBuffer.getChannelData(0), chunk = new Float32Array(x), ms = (x.length / w.ctx.sampleRate) * 1000;
    let sum = 0; for (let i = 0; i < x.length; i++) sum += x[i] * x[i];
    const rms = Math.sqrt(sum / x.length);
    renderWake();
    if (wakeBlocked()) { w.speaking = false; w.seg = []; w.pre = []; return; }
    const threshold = Math.max(WAKE.floorMin, w.floor * 3.5);
    if (!w.speaking) {
      w.floor = w.floor * 0.98 + rms * 0.02;                // adaptive noise floor while quiet
      w.pre.push(chunk); while (w.pre.length * ms > WAKE.preRollMs) w.pre.shift();
      if (rms > threshold) { w.speaking = true; w.seg = w.pre.slice(); w.pre = []; w.speechMs = ms; w.silenceMs = 0; }
      return;
    }
    w.seg.push(chunk);
    if (rms > threshold) { w.speechMs += ms; w.silenceMs = 0; } else w.silenceMs += ms;
    if (w.silenceMs >= WAKE.endSilenceMs || w.seg.length * ms >= WAKE.maxClipMs) {
      const seg = w.seg; w.speaking = false; w.seg = [];
      if (w.speechMs >= WAKE.minSpeechMs) {
        const clip = encodeWav(seg, w.ctx.sampleRate);
        if (wakeChecking) pendingClips.push(clip); else checkClip(clip);
      }
    }
  }
  async function startWake() {
    if (wake) return;
    if (!micAvailable()) { voiceLog("👂 " + t("micInsecure", { h: location.host || HOST }), "e"); wakeOn = false; saveWake(); renderWake(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      const ctx = new (window.AudioContext || window.webkitAudioContext)(), node = ctx.createScriptProcessor(2048, 1, 1);
      ctx.createMediaStreamSource(stream).connect(node); node.connect(ctx.destination);   // the output stays silent
      node.onaudioprocess = onAudio;
      wake = { ctx, stream, node, floor: WAKE.floorMin, pre: [], seg: [], speaking: false, speechMs: 0, silenceMs: 0 };
      if (ctx.state === "suspended") document.addEventListener("click", () => ctx.resume(), { once: true });
      voiceLog("👂 " + t("wakeStarted"), "m");
    } catch (_) { voiceLog("👂 " + t("micDenied"), "e"); wakeOn = false; saveWake(); }
    renderWake();
  }
  function stopWake() {
    if (wake) { wake.node.disconnect(); wake.stream.getTracks().forEach((tr) => tr.stop()); wake.ctx.close(); wake = null; voiceLog("👂 " + t("wakeStopped"), "m"); }
    renderWake();
  }
  function saveWake() { try { localStorage.setItem("jarvis.wake", wakeOn ? "on" : "off"); } catch (_) { /* storage blocked */ } }
  $("wakeBtn").addEventListener("click", () => { wakeOn = !wakeOn; saveWake(); if (wakeOn) startWake(); else stopWake(); });

  // Demo safety: every page load starts in dry-run. A real run needs the explicit toggle plus the confirm dialog.
  function resetDryRun() { $("dryRun").checked = true; renderDryToggle(); }
  addEventListener("pageshow", resetDryRun);                // also after "back" (page restored from cache)

  buildSteps();
  renderMic();
  applyLang();
  resetDryRun();
  if (wakeOn) startWake();
  ping(); setInterval(ping, 4000);
})();
</script>
</body>
</html>
