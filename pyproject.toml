[project]
name = "jarvis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pygithub>=2.0",
    "jira>=3.0",
    "qdrant-client>=1.7",
    "minio>=7.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.25",
    "typer>=0.9",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "pyfiglet>=1.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
jarvis = "jarvis.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]
